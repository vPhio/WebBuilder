<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebBuilder</title>
<style>
  :root {
    --bg: #eef1f6;
    --text: #1c2433;
    --muted: #5b6678;
    --accent: #2f5bea;
    --accent-hover: #2349c4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a24;
      --text: #e6ebf3;
      --muted: #97a3b6;
      --accent: #5b82ff;
      --accent-hover: #7897ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
  }
  h1 {
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }
  p {
    color: var(--muted);
    font-size: 1.15rem;
    margin: 0 0 32px;
  }
  a.button {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 8px;
    transition: background .15s;
  }
  a.button:hover { background: var(--accent-hover); }
  a.button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  footer a { color: inherit; }
  footer {
    position: fixed;
    bottom: 16px;
    left: 0; right: 0;
    font-size: .85rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <main>
    <h1>WebBuilder</h1>
    <p>Von Florian und Jan</p>
    <a class="button" href="/builder">Zum Builder</a>
  </main>
  <footer>© 2026 Phio Studios · <a href="/impressum/">Impressum</a> · <a href="/datenschutz/">Datenschutz</a></footer>
</body>
</html>
