<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bazaar Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">bazaar<span>.</span>tracker</div>
    <input id="search" type="search" placeholder="Item suchen, z.B. Enchanted Diamond" autocomplete="off">
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="stamp">lädt…</span>
    </div>
  </div>
</header>

<main>

  <section>
    <h2>Beste Flips gerade</h2>
    <p class="sub">Kauforder aufgeben, Verkauforder aufgeben, Differenz kassieren. Steuer ist abgezogen.</p>

    <div class="sort">
      <button id="byPct" aria-pressed="true">nach Prozent</button>
      <button id="byCoins" aria-pressed="false">nach Coins</button>
    </div>

    <div id="flips"></div>
  </section>

  <section>
    <h2>Alle Items</h2>
    <p class="sub" id="count">–</p>
    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th>Sofort kaufen</th>
          <th>Sofort verkaufen</th>
          <th>Umsatz / Woche</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

</main>

<footer>
  Daten von der Hypixel API, aktualisiert alle 20 Sekunden.
</footer>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
